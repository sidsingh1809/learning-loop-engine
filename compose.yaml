name: learning-loop-engine
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Run scripts/init_local_env.py first}
      MYSQL_USER: ${MYSQL_USER:?Run scripts/init_local_env.py first}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/init_local_env.py first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/init_local_env.py first}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
  migrate:
    build: .
    environment: &app_env
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}?charset=utf8mb4
      API_KEY: ${API_KEY:?Run scripts/init_local_env.py first}
      DEV_PRINCIPALS: ${DEV_PRINCIPALS:-[]}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment: *app_env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
  db_test:
    image: mysql:8.4
    profiles: ["test"]
    environment:
      MYSQL_DATABASE: learning_loop_test
      MYSQL_USER: loop_test
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
  tests:
    build: .
    profiles: ["test"]
    environment:
      API_KEY: ${API_KEY}
      DATABASE_URL: mysql+pymysql://loop_test:${MYSQL_PASSWORD}@db_test:3306/learning_loop_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://loop_test:${MYSQL_PASSWORD}@db_test:3306/learning_loop_test?charset=utf8mb4
    command: ["python", "-m", "pytest", "-q"]
    depends_on:
      db_test:
        condition: service_healthy
volumes:
  mysql_data:
